# Creates or updates Dataverse dataset
name: dataverse
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      
      - name: Set up Python
        run: uv python install 3.11
    
      - name: Install dependencies
        run: |
          cd validation
          uv sync 
      
      - name: Run Python script
        run: |
          cd validation
          uv run validate.py

  publish-dataverse:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write  
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      
      - name: Set up Python
        run: uv python install 3.11
      
      - name: Install dependencies
        run: |
          cd scripts
          uv sync
      
      - name: Upload to Dataverse using metadata from repository file
        env:
          DATAVERSE_TOKEN: ${{ secrets.DATAVERSE_TOKEN }}
          DATAVERSE_SERVER: https://demo.dataverse.org
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: |
          cd scripts
          uv run python upload_dataverse.py